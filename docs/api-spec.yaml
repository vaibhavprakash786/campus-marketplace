openapi: 3.0.3
info:
  title: College Marketplace API (through Stage 6; later routes proposed)
  version: 0.1.0
  description: All monetary amounts are integer INR paise. Stage 6 messaging uses REST only. Offers, sockets and later routes remain proposals.
servers:
  - url: /api
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Listings
  - name: Conversations
  - name: Offers
  - name: Transactions
  - name: Reports
  - name: Admin
paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register unverified student
      requestBody:
        $ref: '#/components/requestBodies/Registration'
      responses:
        '201': { $ref: '#/components/responses/Item' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in and set session cookie
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      responses:
        '200': { description: Session revoked; JSON message returned }
        '401': { $ref: '#/components/responses/Error' }
  /auth/me:
    patch:
      tags: [Auth]
      summary: Update own name, department or graduationYear only
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      tags: [Auth]
      summary: Current profile and verification status
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/verification:
    post:
      tags: [Auth]
      summary: Submit college verification request using configured method
      requestBody:
        $ref: '#/components/requestBodies/Verification'
      responses:
        '202': { $ref: '#/components/responses/Item' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/verification/status:
    get:
      tags: [Auth]
      summary: Get own verification status and safe next-step information
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/verification/confirm-email:
    post:
      tags: [Auth]
      summary: Redeem short-lived single-use email verification token when email method configured
      requestBody:
        $ref: '#/components/requestBodies/EmailConfirmation'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/verification/sso/start:
    get:
      tags: [Auth]
      summary: Begin configured institutional SSO redirect with CSRF state/nonce/PKCE
      responses:
        '302': { description: Redirect to approved identity provider }
        '409': { $ref: '#/components/responses/Error' }
  /auth/verification/sso/callback:
    get:
      tags: [Auth]
      summary: Identity-provider callback validates state and eligible student claims; deployment-specific parameters TBD
      responses:
        '302': { description: Redirect to frontend with safe outcome }
        '400': { $ref: '#/components/responses/Error' }
  /listings:
    get:
      tags: [Listings]
      summary: List available listings (verified students only), newest first
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/ListingPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Listings]
      summary: Create available listing as verified student; sellerId derived from session
      requestBody: { $ref: '#/components/requestBodies/Listing' }
      responses:
        '201': { $ref: '#/components/responses/ListingItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /listings/my-listings:
    get:
      tags: [Listings]
      summary: List own listings, including archived, newest first (verified student)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/ListingPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /listings/{listingId}:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    get:
      tags: [Listings]
      summary: View an available listing (verified student)
      responses:
        '200': { $ref: '#/components/responses/ListingItem' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Listings]
      summary: Partially edit own available listing; protected fields rejected
      requestBody: { $ref: '#/components/requestBodies/ListingPatch' }
      responses:
        '200': { $ref: '#/components/responses/ListingItem' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Listings]
      summary: Soft-remove own available listing; historical record preserved
      responses:
        '204': { description: Listing archived, no response body }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /listings/{listingId}/upload-intent:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    post:
      tags: [Listings]
      summary: Owner requests short-lived signed image upload parameters
      requestBody:
        $ref: '#/components/requestBodies/Upload'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
  /listings/{listingId}/images:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    post:
      tags: [Listings]
      summary: Owner finalizes previously signed uploaded image
      requestBody:
        $ref: '#/components/requestBodies/UploadFinalize'
      responses:
        '201': { $ref: '#/components/responses/Item' }
        '400': { $ref: '#/components/responses/Error' }
  /conversations:
    get:
      tags: [Conversations]
      summary: List verified participant conversations by latest activity
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: '{data: ConversationSummary[], page: {page, limit, hasMore}}; see docs/messaging.md'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Conversations]
      summary: Start or retrieve a conversation for an available listing
      requestBody:
        $ref: '#/components/requestBodies/Conversation'
      responses:
        '200': { description: 'Existing conversation: {data: {_id}}' }
        '201': { description: 'Created conversation: {data: {_id}}' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}/messages:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    get:
      tags: [Conversations]
      summary: Latest messages in chronological order; participants only
      parameters:
        - { name: before, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: '{data: Message[], conversation: ConversationSummary, page: {hasMore, nextBefore}}; see docs/messaging.md'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Conversations]
      summary: Persist participant text message and update conversation summary
      requestBody:
        $ref: '#/components/requestBodies/Message'
      responses:
        '201': { description: 'Saved message: {data: Message}' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}/offers:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    get:
      tags: [Offers]
      summary: View immutable negotiation history (participants only)
      responses:
        '200': { $ref: '#/components/responses/Page' }
    post:
      tags: [Offers]
      summary: Buyer initiates or recipient counters current pending offer; one pending per conversation
      requestBody:
        $ref: '#/components/requestBodies/Offer'
      responses:
        '201': { $ref: '#/components/responses/Item' }
        '409': { $ref: '#/components/responses/Error' }
  /offers/{offerId}/decision:
    parameters:
      - { $ref: '#/components/parameters/OfferId' }
    post:
      tags: [Offers]
      summary: Pending-offer recipient accepts or rejects; accept atomically creates reservation (Stage 8)
      requestBody:
        $ref: '#/components/requestBodies/Decision'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /offers/{offerId}/withdraw:
    parameters:
      - { $ref: '#/components/parameters/OfferId' }
    post:
      tags: [Offers]
      summary: Pending-offer proposer withdraws own offer; conditional pending to withdrawn
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /transactions:
    get:
      tags: [Transactions]
      summary: List own transactions
      responses:
        '200': { $ref: '#/components/responses/Page' }
  /transactions/{transactionId}/confirm:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Transactions]
      summary: Buyer or seller confirms handover; both confirmations complete sale
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /transactions/{transactionId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Transactions]
      summary: Party cancels reservation under approved cancellation policy
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '409': { $ref: '#/components/responses/Error' }
  /transactions/{transactionId}/dispute:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Transactions]
      summary: Party opens handover dispute, retains listing reservation
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '409': { $ref: '#/components/responses/Error' }
  /reports:
    post:
      tags: [Reports]
      summary: Verified student reports listing or user
      requestBody:
        $ref: '#/components/requestBodies/Report'
      responses:
        '201': { $ref: '#/components/responses/Item' }
        '400': { $ref: '#/components/responses/Error' }
  /admin/verifications:
    get:
      tags: [Admin]
      summary: Authorized verification reviewer lists pending manual requests (no evidence in list)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, rejected, verified] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/verifications/{userId}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    get:
      tags: [Admin]
      summary: Authorized reviewer inspects verification request and controlled private evidence reference
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      summary: Approve or reject pending manual verification with atomic audit entry
      requestBody:
        $ref: '#/components/requestBodies/VerificationDecision'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/verifications/{userId}/revoke:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    post:
      tags: [Admin]
      summary: Authorized reviewer revokes verified status with atomic audit entry
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Restricted audit reviewer reads paginated sanitized administrator action logs
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/reports:
    get:
      tags: [Admin]
      summary: Admin-only report queue
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/reports/{reportId}:
    parameters:
      - { $ref: '#/components/parameters/ReportId' }
    patch:
      tags: [Admin]
      summary: Admin updates report status and resolution
      requestBody:
        $ref: '#/components/requestBodies/Moderation'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/suspend:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    post:
      tags: [Admin]
      summary: Admin suspends user with audit record
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200': { $ref: '#/components/responses/Item' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: campus_session }
  parameters:
    ListingId: { name: listingId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    OfferId: { name: offerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ReportId: { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
  schemas:
    ListingRecord:
      type: object
      required: [_id, sellerId, title, description, category, pricePaise, condition, location, status, imageAssets, createdAt, updatedAt]
      properties:
        _id: { $ref: '#/components/schemas/Id' }
        sellerId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        pricePaise: { type: integer, minimum: 1 }
        condition: { type: string, enum: [new, like_new, good, fair, poor] }
        location: { type: string }
        status: { type: string, enum: [available, reserved, sold, removed] }
        imageAssets:
          type: array
          items:
            type: object
            properties:
              publicId: { type: string }
              url: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Id: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    Item:
      type: object
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }
    Page:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { type: object, additionalProperties: true } }
        page:
          type: object
          required: [nextCursor]
          properties:
            nextCursor: { type: string, nullable: true }
  responses:
    Item: { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
    Page: { description: Paginated result, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
    Error: { description: Validation, authentication, authorization, missing resource, conflict, or rate limit error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ListingItem:
      description: Listing response in {data} wrapper
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ListingRecord' }
    ListingPage:
      description: Paginated listing response with page, limit, total and hasMore
      content:
        application/json:
          schema:
            type: object
            required: [data, page]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/ListingRecord' } }
              page:
                type: object
                required: [page, limit, total, hasMore]
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }
  requestBodies:
    Registration:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, name, department, graduationYear]
            properties:
              email: { type: string, format: email }
              password: { type: string, minLength: 12 }
              name: { type: string, minLength: 1, maxLength: 100 }
              department: { type: string, minLength: 1, maxLength: 80 }
              graduationYear: { type: integer }
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string }
    Verification:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [method]
            properties:
              method: { type: string, enum: [college_email, manual_review, sso] }
              evidenceToken: { type: string, description: Private short-lived reference, not public URL }
    EmailConfirmation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token: { type: string, minLength: 1 }
    VerificationDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [decision, reason]
            properties:
              decision: { type: string, enum: [approve, reject] }
              reason: { type: string, minLength: 3, maxLength: 1000 }
    ListingPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              title: { type: string, minLength: 3, maxLength: 120 }
              description: { type: string, minLength: 5, maxLength: 5000 }
              category: { type: string, minLength: 1, maxLength: 60 }
              condition: { type: string, enum: [new, like_new, good, fair, poor] }
              pricePaise: { type: integer, minimum: 1 }
              location: { type: string, minLength: 2, maxLength: 120 }
    Listing:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, description, category, condition, pricePaise, location]
            properties:
              title: { type: string, minLength: 3, maxLength: 120 }
              description: { type: string, minLength: 5, maxLength: 5000 }
              category: { type: string, maxLength: 60 }
              condition: { type: string, enum: [new, like_new, good, fair, poor] }
              pricePaise: { type: integer, minimum: 1 }
              location: { type: string, minLength: 2, maxLength: 120 }
    Conversation:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [listingId]
            additionalProperties: false
            properties:
              listingId: { $ref: '#/components/schemas/Id' }
    Message:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [text]
            additionalProperties: false
            properties:
              text: { type: string, minLength: 1, maxLength: 2000 }
    Offer:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amountPaise]
            properties:
              amountPaise: { type: integer, minimum: 1 }
              parentOfferId: { $ref: '#/components/schemas/Id', description: Required for counter; forbidden for initial buyer offer }
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision: { type: string, enum: [accept, reject] }
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 3, maxLength: 1000 }
    Report:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetType, targetId, reason]
            properties:
              targetType: { type: string, enum: [listing, user] }
              targetId: { $ref: '#/components/schemas/Id' }
              reason: { type: string, minLength: 3, maxLength: 200 }
              details: { type: string, maxLength: 2000 }
    Moderation:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [reviewing, resolved, dismissed] }
              resolution: { type: string, maxLength: 1000 }
    Upload:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mimeType, sizeBytes]
            properties:
              mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
              sizeBytes: { type: integer, minimum: 1 }
    UploadFinalize:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [publicId]
            properties:
              publicId: { type: string }
x-socket-io:
  sourceOfTruth: MongoDB; all business mutations are persisted through REST before emitting events.
  negotiation: Buyer starts; current recipient may accept/reject/counter; proposer may withdraw; acceptance only enabled with Stage 8 atomic reservation transaction. Terminal offer states never reopen. Events are emitted only after commit.
  verification: Only the selected institutional method is deployed; manual review admin routes require reviewer privilege and append-only audit logging.
  errorPolicy: 401 unauthenticated, 403 unverified/unauthorized, 404 hidden or absent resource, 409 invalid lifecycle/concurrency or acceptance unavailable before Stage 8; mutation endpoints require CSRF protection for cookie auth.
  handshake: Authenticated session cookie; reject suspended/unverified users.
  clientEvents:
    conversation.join:
      payload: { conversationId: ObjectId string }
      authorization: Must be a conversation participant; joins notification room only.
  serverEvents:
    message.created:
      payload: { messageId: ObjectId string, conversationId: ObjectId string, senderId: ObjectId string, body: string, createdAt: ISO8601 string }
    offer.created:
      payload: { offerId: ObjectId string, conversationId: ObjectId string, amountPaise: integer, proposedBy: ObjectId string, status: pending }
    offer.updated:
      payload: { offerId: ObjectId string, conversationId: ObjectId string, status: accepted/rejected/countered/withdrawn/expired, transactionId: optional ObjectId string }
  reconnect: Clients fetch missed history via paginated REST; event delivery is not guaranteed.

